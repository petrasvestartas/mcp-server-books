[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "books-mcp"
version = "0.1.0"
description = "MCP server of the BRG book library: read, OCR, translate, publish scanned books"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
tools = ["pymupdf", "pillow", "numpy", "opencv-python-headless", "matplotlib"]
dev = ["pytest>=8,<10", "ruff"]

[project.scripts]
books-mcp = "books_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/books_mcp"]

[tool.ruff]
line-length = 179
extend-exclude = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
